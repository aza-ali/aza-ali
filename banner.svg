<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1707 320" width="1707" height="320" role="img" aria-label="Hi, I'm Aza — Product Manager and Builder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1707" height="320" fill="url(#bg)"/>
  <rect width="1707" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#accent)"/>

  <g opacity="0.04">
    <line x1="0" y1="80" x2="1707" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1707" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1707" y2="240" stroke="#ffffff" stroke-width="1"/>
  </g>

  <text x="72" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="100" font-weight="700" fill="#f0f6fc" letter-spacing="-2">Hi, I'm Aza 👋</text>

  <text x="72" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#c9d1d9">Product Manager <tspan font-weight="300" fill="#6e7681">·</tspan> Builder</text>

  <text x="72" y="260" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#58a6ff">Building products that make each person feel like ten.</text>
</svg>
